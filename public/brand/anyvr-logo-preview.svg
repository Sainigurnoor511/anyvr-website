<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="preview-title preview-description">
  <title id="preview-title">AnyVR: one visor, one doorway</title>
  <desc id="preview-description">Isolated logo proposal in charcoal and off-white. Large mark, reversed mark, exploratory live-type lockup, and actual 24 and 32 pixel mark widths. Not an approved brand identity.</desc>
  <defs>
    <symbol id="visor" viewBox="0 0 224 120">
      <path d="M38 0 H186 C213 0 224 12 224 38 V82 C224 107 209 120 186 120 C169 120 152 116 140 112 V43 L84 28 V112 C72 116 55 120 38 120 C15 120 0 107 0 82 V38 C0 12 11 0 38 0 Z"/>
    </symbol>
  </defs>
  <rect width="1440" height="1000" fill="#F5F4F0"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" fill="#242626">
    <text x="64" y="70" font-size="28" font-weight="600" letter-spacing="-.6">AnyVR / Mark study</text>
    <text x="1376" y="68" text-anchor="end" font-size="14" letter-spacing="1.2">ONE SILHOUETTE. ONE OPENING.</text>
    <path d="M64 110 H1376" stroke="#242626" stroke-opacity=".18"/>

    <use xlink:href="#visor" x="216" y="242" width="448" height="240"/>
    <text x="64" y="568" font-size="16" font-weight="600">Visor outside. Doorway within.</text>
    <text x="64" y="595" font-size="15" opacity=".72">An open cut, not a second symbol placed on top.</text>

    <use xlink:href="#visor" x="64" y="659" width="112" height="60"/>
    <text x="201" y="715" font-size="76" font-weight="600" letter-spacing="-2.5">AnyVR</text>
    <text x="64" y="764" font-size="14" opacity=".72">Lockup exploration only. Live SF/system type; not a final wordmark.</text>
    <path d="M64 809 H880" stroke="#242626" stroke-opacity=".18"/>
    <use xlink:href="#visor" x="64" y="856" width="24" height="12.857143"/>
    <text x="103" y="868" font-size="14">24 px</text>
    <use xlink:href="#visor" x="208" y="854" width="32" height="17.142857"/>
    <text x="255" y="868" font-size="14">32 px</text>
    <text x="64" y="906" font-size="13" opacity=".72">Actual mark widths at 100% preview. Transparent opening in both SVG masters.</text>

    <rect x="960" y="160" width="416" height="649" fill="#242626"/>
    <g fill="#F5F4F0">
      <text x="1000" y="207" font-size="13" letter-spacing="1.2">REVERSED</text>
      <use xlink:href="#visor" x="1028" y="306" width="280" height="150"/>
      <use xlink:href="#visor" x="1000" y="648" width="24" height="12.857143"/>
      <text x="1040" y="660" font-size="14">24 px</text>
      <use xlink:href="#visor" x="1144" y="646" width="32" height="17.142857"/>
      <text x="1192" y="660" font-size="14">32 px</text>
      <text x="1000" y="765" font-size="13" opacity=".75">Off-white #F5F4F0 / Charcoal #242626</text>
    </g>
    <text x="960" y="857" font-size="14" font-weight="600">Single filled contour.</text>
    <text x="960" y="882" font-size="14" opacity=".72">No strokes, overlays, knobs, or effects.</text>
    <path d="M64 942 H1376" stroke="#242626" stroke-opacity=".18"/>
    <text x="64" y="974" font-size="12" opacity=".7">DESIGN PROPOSAL / Not integrated into the website</text>
    <text x="1376" y="974" text-anchor="end" font-size="12" opacity=".7">Subject to approval and trademark clearance</text>
  </g>
</svg>
